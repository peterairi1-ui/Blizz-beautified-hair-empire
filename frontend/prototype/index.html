<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rubbies Signature - Luxury Wigs</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="nav-icons">
            <i class="fas fa-bars" style="cursor: pointer;"></i>
        </div>
        <div class="logo-area">
            <h1>BZB</h1>
            <p>BLizz beautified</p>
        </div>
        <div class="nav-icons">
            <i class="fas fa-search" style="cursor: pointer;"></i>
            <div class="cart-icon-wrapper">
                <i class="fas fa-shopping-cart"></i>
                <span class="cart-badge" id="cart-counter">0</span>
            </div>
        </div>
    </header>

    <section class="hero-banner">
        <div class="hero-text">
            <p>Shop now and refresh your image</p>
            <h2>with a Pixie Cut Wig</h2>
            <button class="view-collection-btn">View Collections</button>
        </div>
        <div class="hero-images">
            <img src="https://images.unsplash.com/photo-1605497746444-ac9da5848ba7?auto=format&fit=crop&w=400&q=80" alt="Pixie Cut Showcase">
        </div>
    </section>

    <div class="category-title-bar">
        Glueless Luxury Wigs
    </div>

    <main class="product-container">
        <div class="product-card">
            <div class="product-image-container">
                <img src="https://images.unsplash.com/photo-1562322140-8baeececf3df?auto=format&fit=crop&w=400&q=80" alt="Bougie Beige Wig">
            </div>
            <div>
                <h3 class="product-title">Bougie Beige</h3>
                <div class="rating-stars">
                    <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                </div>
                <div class="product-price">$3,077</div>
            </div>
            <button class="add-to-cart-btn">Add to Cart</button>
        </div>

        <div class="product-card">
            <div class="product-image-container">
                <img src="https://images.unsplash.com/photo-1632435496852-287b02787891?auto=format&fit=crop&w=400&q=80" alt="Charisse Raw Curly Wig">
            </div>
            <div>
                <h3 class="product-title">Charisse Raw Curly</h3>
                <div class="rating-stars">
                    <i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i><i class="fas fa-star"></i>
                </div>
                <div class="product-price">$762</div>
            </div>
            <button class="add-to-cart-btn">Add to Cart</button>
        </div>
    </main>

    <div class="currency-tabs">
        <div class="currency-tab">NG</div>
        <div class="currency-tab active">US</div>
        <div class="currency-tab">EU</div>
        <div class="currency-tab">GB</div>
        <div class="currency-tab">ZA</div>
    </div>

    <a href="https://wa.me/1234567890" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>

    <div class="chat-float">
        <i class="fas fa-comment-alt"></i>
        <span class="chat-badge">1</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
